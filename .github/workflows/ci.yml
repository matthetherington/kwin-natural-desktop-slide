name: Portable core and tools
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-patch:
        description: Prepared scheduled-release patch artifact from this workflow run
        type: string
        default: ''
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        widgets: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.source-patch != ''
        with:
          name: ${{ inputs.source-patch }}
          path: ${{ runner.temp }}/release-source
      - name: Apply the prepared release snapshot
        if: inputs.source-patch != ''
        run: git apply --check "$RUNNER_TEMP/release-source/scheduled-release.patch" && git apply "$RUNNER_TEMP/release-source/scheduled-release.patch"
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang libgl1-mesa-dev fonts-dejavu-core
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure without private KWin dependencies
        env:
          CXX: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_KWIN_EFFECT=OFF
          -DBUILD_CONFIGURATOR=${{ matrix.widgets }}
          -DBUILD_DIAGNOSTIC=${{ matrix.widgets }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: git diff --check

  distribution-core:
    name: Core / ${{ matrix.image }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: [debian:13, fedora:45]
    steps:
      - name: Native distribution dependencies
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y git cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev python3 fonts-dejavu-core
          else
            dnf --refresh install -y git cmake ninja-build gcc-c++ qt6-qtbase-devel mesa-libGL-devel python3 dejavu-sans-fonts
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.source-patch != ''
        with:
          name: ${{ inputs.source-patch }}
          path: ${{ runner.temp }}/release-source
      - name: Apply the prepared release snapshot
        if: inputs.source-patch != ''
        run: git apply --check "$RUNNER_TEMP/release-source/scheduled-release.patch" && git apply "$RUNNER_TEMP/release-source/scheduled-release.patch"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_KWIN_EFFECT=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  fedora-effect:
    name: Native effect / Fedora 45 / x86_64 / SO_NO_EXE=${{ matrix.so-no-exe }}
    runs-on: ubuntu-24.04
    container: fedora:45
    strategy:
      fail-fast: false
      matrix:
        so-no-exe: ["ON", "OFF"]
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Matching distribution SDK
        run: >-
          dnf --refresh install -y git cmake ninja-build gcc-c++ python3
          kwin-devel qt6-qtbase-devel qt6-qtdeclarative-devel extra-cmake-modules
          kf6-kcmutils-devel kf6-kcoreaddons-devel libepoxy-devel libdrm-devel dejavu-sans-fonts
          vulkan-loader-devel wayland-devel libxkbcommon-devel
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.source-patch != ''
        with:
          name: ${{ inputs.source-patch }}
          path: ${{ runner.temp }}/release-source
      - name: Apply the prepared release snapshot
        if: inputs.source-patch != ''
        run: git apply --check "$RUNNER_TEMP/release-source/scheduled-release.patch" && git apply "$RUNNER_TEMP/release-source/scheduled-release.patch"
      # Accept patches only on supported source branches; keep exact binary guards.
      # Exercise both Debian/Ubuntu and Fedora-style shared-library mode defaults.
      - run: >-
          cmake -S . -B build-effect -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_KWIN_EFFECT=ON -DCMAKE_INSTALL_SO_NO_EXE=${{ matrix.so-no-exe }}
      - run: cmake --build build-effect --parallel 2
      - run: ctest --test-dir build-effect --output-on-failure
